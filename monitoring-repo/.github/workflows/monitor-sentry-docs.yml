name: Monitor Sentry Docs Changes
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-monitor
  cancel-in-progress: false
jobs:
  monitor-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deliver commits in order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node poll-github.cjs
      - name: Persist successful checkpoint even after a later failure
        if: always()
        run: |
          if [ -f last-processed-sha.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add last-processed-sha.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: save docs polling checkpoint [skip ci]'
              git push
            fi
          fi
